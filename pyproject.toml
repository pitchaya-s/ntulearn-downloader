[project]
name = "ntulearn-downloader"
version = "0.1.0"
description = "Standalone CLI to recursively download NTULearn course materials."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "pitchaya-s" },
]

dependencies = [
    "beautifulsoup4>=4.14.3",
    "browser-cookie3>=0.20.1",
    "httpx>=0.28.1",
    "keyring>=25.0",
]

[project.scripts]
ntulearn-download = "ntulearn_downloader.cli:main"

[project.urls]
Repository = "https://github.com/pitchaya-s/ntulearn-downloader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntulearn_downloader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
